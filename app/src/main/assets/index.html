<title>Casa 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Interface limpa: fundo escuro neutro, mosaicos grandes e redondos, âmbar só para o que está ligado. */
:root{
  --bg:#16171c; --panel:#1d1f26; --tile:#262932; --line:#2d303a;
  --fg:#f4f1ea; --mute:#8e919c;
  --amber:#f2b134; --amber-ink:#2b1c00;
  --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-body:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
#top h1{margin:0;font:700 20px/1.1 var(--font-display);letter-spacing:-.01em}
#sum{margin:4px 0 0;color:var(--mute);font-size:12.5px}
#sum b{color:var(--amber);font-weight:700}
#gear{flex:none;width:40px;height:40px;border:0;background:var(--tile);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--mute)}
#gear svg{width:19px;height:19px}
#gear.ok{color:var(--amber)}
#gear[hidden]{display:none}
.hr{display:flex;gap:8px;flex:none}
#cfg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;z-index:50}
#cfg[hidden]{display:none}
.cfgbox{width:100%;max-height:90vh;overflow-y:auto;background:var(--panel);border-radius:28px 28px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-sizing:border-box}
.cfgbox h2{margin:0 0 4px;font:700 18px var(--font-display)}
.cfgp{margin:0 0 14px;color:var(--mute);font-size:12.5px}
.cfgbox label{display:block;margin:0 0 10px;font-size:12px;color:var(--mute);font-weight:600}
.cfgbox input,.cfgbox select{display:block;width:100%;box-sizing:border-box;margin-top:5px;background:var(--tile);border:0;border-radius:12px;padding:11px 12px;color:var(--fg);font:inherit;font-size:14px}
.cfbtn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;background:var(--amber);color:var(--amber-ink);margin-top:4px}
.cfbtn.ghost{background:var(--tile);color:var(--fg);margin-top:14px}
#cf_map .mrow{display:flex;gap:8px;align-items:flex-end;margin-bottom:10px}
#cf_map .mrow label{flex:1;margin:0}
.tbtn{flex:none;border:0;border-radius:12px;background:var(--tile);color:var(--amber);font-weight:700;font-size:12.5px;padding:11px 12px}
.sbtn{margin:0 0 12px;background:var(--tile);color:var(--amber)}
#cf_msg{min-height:18px;margin:10px 0 6px;font-size:12.5px;color:var(--mute)}
#cf_map h3{margin:14px 0 8px;font:700 13px var(--font-body)}
#dn{flex:none;width:40px;height:40px;border:0;background:var(--tile);border-radius:50%;display:grid;place-items:center;padding:0}
#dn svg{width:19px;height:19px}
.badge{position:absolute;left:0;top:0;margin:-17px 0 0 -17px;will-change:transform;width:34px;height:34px;border-radius:50%;border:2px solid #8d8a82;background:rgba(18,18,22,.78);color:#b9b5ab;display:grid;place-items:center;padding:0;pointer-events:auto}
.badge svg{width:17px;height:17px}
.badge.on{border-color:var(--amber);color:var(--amber);background:rgba(60,42,8,.7);box-shadow:0 0 14px rgba(242,177,52,.55)}
.badge:focus-visible{outline:2px solid #fff;outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;width:0;height:0;will-change:transform;font:600 9.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#e4dfd4;text-shadow:0 1px 6px #000,0 0 2px #000;white-space:nowrap;opacity:.55}
.lbl span{position:absolute;left:0;top:0;transform:translate(-50%,-50%)}
.lbl.sel{color:#fff;opacity:1;font-weight:700}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#c8c4bb;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .6s}
#hint.off{opacity:0}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:rgba(18,18,22,.94);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{flex:none;height:min(46vh,440px);background:var(--panel);border-radius:28px 28px 0 0;display:flex;flex-direction:column;min-height:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px max(18px,env(safe-area-inset-right,0px)) 2px max(18px,env(safe-area-inset-left,0px))}
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px max(18px,env(safe-area-inset-right,0px)) 2px max(18px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;color:var(--mute)}
.chip.on{background:var(--fg);color:#16171c}
.dial{position:relative;width:230px;margin:6px auto 0;touch-action:none}
.dial svg{display:block;width:100%;height:auto}
.dial .dv{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.dial .dv small{font:700 10px var(--font-body);letter-spacing:.12em;color:var(--mute)}
.dial .dv b{font:300 46px var(--font-body);letter-spacing:-.02em}
.camgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 12px}
.camgrid[hidden],.tch[hidden]{display:none}
.camgrid{grid-column:1/-1}
.camt{position:relative;border-radius:18px;overflow:hidden;background:#0c0d10;aspect-ratio:16/9;border:1px solid var(--line);padding:0;color:#fff;text-align:left}
.camt video{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.camt .nm{position:absolute;left:0;right:0;bottom:0;padding:18px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.72));font:600 12.5px var(--font-body)}
.camt .nm small{display:block;font-weight:400;opacity:.7;font-size:11px}
.camt .lv{position:absolute;right:10px;top:10px;width:9px;height:9px;border-radius:50%;background:#ff3b4e;box-shadow:0 0 8px #ff3b4e}
.camt .ms{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-size:12px;color:#b9b5ab;padding:0 12px}
.spnp{display:flex;gap:12px;align-items:center;background:var(--tile);border-radius:16px;padding:10px;margin:12px 0}
.spnp img{width:68px;height:68px;border-radius:10px;object-fit:cover;background:#0c0d10;flex:none}
.spnp .t{min-width:0;flex:1}.spnp .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spnp .t small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spbar{height:8px;background:#2b2d36;border-radius:4px;margin-top:9px;cursor:pointer}.spbar i{display:block;height:100%;width:0;background:#1ed760;border-radius:4px}
.spres button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:var(--tile);color:var(--fg);border-radius:12px;padding:8px 10px;margin:0 0 6px}
.spres img{width:40px;height:40px;border-radius:6px;object-fit:cover;flex:none;background:#0c0d10}
.spres span{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px}.spres small{display:block;color:var(--mute);font-size:11.5px}
.tvd{background:radial-gradient(120% 55% at 50% 0%,#18606d 0%,#0f2a31 42%,#0b0d10 100%)!important}
.tvd .tvk button,.tvd .pad button,.tvd .tchip,.tvd .heat button,.tvd .xbtn,.tvd .pwr{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);color:#fff;-webkit-backdrop-filter:none}
.tvd .tvk button:active,.tvd .pad button:active,.tvd .tchip:active,.tvd .heat button:active{background:rgba(255,255,255,.95)!important;color:#111!important}
.tvd .tchip.on,.tvd .pwr.on{background:rgba(255,255,255,.95);color:#111}
.tvd .spnp,.tvd .txt,.tvd .spres button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.tvd .tvk .pw{background:rgba(255,90,82,.22);color:#ff8a82;border-color:rgba(255,90,82,.4)}
.tvd #dl_v{filter:drop-shadow(0 0 7px rgba(74,168,255,.6))}
.tvd .dial svg path:first-of-type{stroke:rgba(255,255,255,.12)}
.tvd .dial .dv b{text-shadow:0 0 18px rgba(120,220,255,.35)}
.volb{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.volb button{flex:none;width:64px;height:64px;border-radius:50%;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.1);color:#fff;font-size:26px;font-weight:300;padding:0}
.volb button:active{background:rgba(255,255,255,.95);color:#111}
.volb .vm{flex:1;text-align:center}.volb .vm small{display:block;font:700 10px var(--font-body);letter-spacing:.12em;color:rgba(255,255,255,.6);margin-bottom:6px}
.volb .vm i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,#4aa8ff,#7fe3ff);box-shadow:0 0 12px rgba(74,168,255,.5)}
.tvk{display:flex;gap:10px;justify-content:center;align-items:center;margin:12px 0}
.tvk button{border:0;background:var(--tile);color:var(--fg);border-radius:99px;min-width:52px;height:46px;padding:0 14px;font-size:18px;font-weight:600}
.tvk button:active{background:var(--amber);color:var(--amber-ink)}
.tvk .pw{background:#5a1f26;color:#ff8a8a}
.chip.add{border:1px dashed var(--line);color:var(--amber)}
#place{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(18,18,22,.94);border:1px solid var(--amber);padding:8px 8px 8px 14px;border-radius:99px;font-size:12.5px;z-index:5;white-space:nowrap}
#place[hidden]{display:none}
#place button{border:0;border-radius:99px;padding:6px 12px;background:var(--tile);color:var(--fg);font-weight:600}
.tyg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.tyg button{border:1px solid var(--line);background:var(--tile);color:var(--fg);border-radius:14px;padding:10px 4px;display:grid;justify-items:center;gap:4px;font-size:12px}
.tyg button svg{width:22px;height:22px}
.tyg button.on{border-color:var(--amber);color:var(--amber)}
.txt{width:100%;box-sizing:border-box;background:var(--tile);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:11px 12px;font:inherit;margin:6px 0 12px}
.chip small{display:none}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--tile);border-radius:18px;padding:12px 4px 10px;font-weight:600;font-size:11.5px;color:var(--fg)}
.scene:active{background:#343845}
.scene svg{width:20px;height:20px;color:var(--amber)}
#list{flex:1;min-height:0;overflow-y:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.row{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:96px;background:var(--tile);border-radius:20px;padding:14px;cursor:pointer;user-select:none;transition:background .2s}
.row.on{background:var(--amber);color:var(--amber-ink)}
.ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--mute)}
.row.on .ico{background:rgba(43,28,0,.13);color:var(--amber-ink)}
.ico svg{width:18px;height:18px}
.meta{min-width:0}
.meta b{display:block;font-weight:700;font-size:13.5px;line-height:1.25}
.meta small{display:block;margin-top:2px;color:var(--mute);font-size:11.5px}
.row.on .meta small{color:rgba(43,28,0,.7)}
.row:focus-visible,.chip:focus-visible,.scene:focus-visible,.step:focus-visible,#dn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.temp{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px}
.step{width:26px;height:26px;border-radius:50%;border:0;background:rgba(43,28,0,.14);font-weight:700;font-size:15px;line-height:1;color:inherit;padding:0}
.row:not(.on) .step{background:rgba(255,255,255,.08)}
.temp span{min-width:30px;text-align:center;font-weight:700;font-size:12.5px}
#note{grid-column:1/-1;color:var(--mute);font-size:11.5px;text-align:center;margin:4px 0 0}
#fs{flex:none;width:40px;height:40px;border:0;background:var(--tile);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--mute)}
#fs svg{width:18px;height:18px}
.scenes{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.scenes::-webkit-scrollbar{display:none}
.scene{flex:0 0 84px;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.scene.add{background:transparent;border:1px dashed var(--line);color:var(--mute)}
.scene.add svg{color:var(--mute)}
.row{-webkit-touch-callout:none;-webkit-user-select:none}
.more{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.07);color:inherit;display:grid;place-items:center;padding:0}
.row.on .more{background:rgba(43,28,0,.13)}
.more svg{width:16px;height:16px}
.ov{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.ov[hidden]{display:none}
.ov .cfgbox{max-width:560px}
.dthead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.dthead h2{margin:0}
.xbtn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--tile);color:var(--fg);font-size:22px;line-height:1;padding:0}
.dtp{display:flex;align-items:center;gap:14px}
.dtp b{display:block;font-size:15px}
.dtp small{color:var(--mute);font-size:12.5px}
.pwr{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--tile);color:var(--mute);display:grid;place-items:center;padding:0}
.pwr.on{background:var(--amber);color:var(--amber-ink)}
.pwr svg{width:28px;height:28px}
.dsec{margin:18px 0 0}
.dsec h4{margin:0 0 2px;font:700 11.5px var(--font-body);color:var(--mute);letter-spacing:.07em;text-transform:uppercase;display:flex;justify-content:space-between}
.dsec h4 span+span{color:var(--fg);letter-spacing:0}
.sl{display:block;width:100%;height:32px;-webkit-appearance:none;appearance:none;background:transparent;margin:4px 0;padding:0}
.sl::-webkit-slider-runnable-track{height:12px;border-radius:99px;background:var(--trk,#444)}
.sl::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;margin-top:-7px;border-radius:50%;background:#fff;border:0;box-shadow:0 1px 6px rgba(0,0,0,.55)}
.sw8{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.sw8 button{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.18);padding:0}
.tch{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tchip{border:0;background:var(--tile);color:var(--fg);border-radius:99px;padding:9px 14px;font-weight:600;font-size:13px}
.tchip.on{background:var(--amber);color:var(--amber-ink)}
.tchip svg{width:18px;height:18px;display:block}
.heat{display:flex;align-items:center;justify-content:center;gap:24px;margin:8px 0 0}
.heat b{font:700 46px var(--font-display);min-width:110px;text-align:center}
.heat button{width:50px;height:50px;border-radius:50%;border:0;background:var(--tile);font-size:26px;color:var(--fg);padding:0}
.seg{display:flex;background:var(--tile);border-radius:12px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;color:var(--mute);padding:7px 10px;border-radius:9px;font-weight:600;font-size:12px}
.seg button.on{background:var(--fg);color:#16171c}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0;font-size:13.5px;font-weight:600}
.srow span{min-width:0}
.rh{margin:14px 0 2px;font:700 11.5px var(--font-body);color:var(--mute);letter-spacing:.07em;text-transform:uppercase}
.mut{color:var(--mute);font-size:12.5px}
#cam .cfgbox{max-width:760px}
#cambox video{display:block;width:100%;background:#000;border-radius:16px;aspect-ratio:16/9;max-height:62vh}
#cambox.big{position:fixed;top:0;right:0;bottom:0;left:0;max-width:none;max-height:none;width:auto;border-radius:0;padding:10px;display:flex;flex-direction:column;overflow-y:auto}
#cambox.big video{flex:1;min-height:0;max-height:none;aspect-ratio:auto;object-fit:contain}
.vwrap{position:relative}
#cambox.big .vwrap{flex:1;min-height:0;display:flex}
.live{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:6px;background:rgba(18,18,22,.72);border-radius:99px;padding:4px 10px 4px 8px;font:700 10.5px var(--font-body);letter-spacing:.08em;color:#fff;pointer-events:none}
.live i{width:8px;height:8px;border-radius:50%;background:#ff3b4e;animation:lv 1.4s infinite}
@keyframes lv{50%{opacity:.25}}
.vctl{position:absolute;right:8px;bottom:8px;display:flex;gap:8px}
.vctl button{width:38px;height:38px;border:0;border-radius:50%;background:rgba(18,18,22,.72);color:#fff;font-size:17px;padding:0;display:grid;place-items:center}
.pad{display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);gap:8px;margin:14px auto 4px;width:max-content}
.pad button{border:0;border-radius:50%;background:var(--tile);color:var(--fg);font-size:22px;padding:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
.pad button:active{background:var(--amber);color:var(--amber-ink)}
.pad i{display:block}
@media (orientation:landscape) and (min-width:700px){
  body{display:grid;grid-template-columns:minmax(0,1fr) 400px;grid-template-rows:auto minmax(0,1fr)}
  #top{grid-column:1;grid-row:1}
  #stage{grid-column:1;grid-row:2}
  #sheet{grid-column:2;grid-row:1 / 3;height:auto;border-radius:28px 0 0 28px}
  #list{grid-template-columns:repeat(2,1fr)}
  .ov{align-items:center}
  .ov .cfgbox{border-radius:28px;max-height:86vh}
}
#hm{flex:none;width:40px;height:40px;border:0;background:var(--tile);border-radius:50%;display:grid;place-items:center;padding:0}
#hm svg{width:19px;height:19px}
body.house #hm{background:var(--amber);color:var(--amber-ink)}
#dock{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;flex-wrap:wrap;justify-content:center;gap:9px;padding:0 14px;z-index:4;pointer-events:none}
body.house #dock{display:flex}
#dock button{pointer-events:auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(18,18,22,.8);color:#f4f1ea;display:grid;place-items:center;padding:0;box-shadow:0 2px 10px rgba(0,0,0,.35)}
#dock button svg{width:20px;height:20px}
#dock button:active{background:#f4f1ea;color:#111}
#dock i{width:1px;height:26px;background:rgba(255,255,255,.18);align-self:center;pointer-events:none}
body.house #sheet,body.house #sum,body.house #hint{display:none}
body.house #top{padding-bottom:2px}
body.house #top h1{font-size:17px}
body.house #stage{flex:1}
@media (orientation:landscape) and (min-width:700px){ body.house{grid-template-columns:minmax(0,1fr)} body.house #top,body.house #stage{grid-column:1} }
@media (max-width:699px),(max-height:520px){
  .ov .cfgbox{max-height:74vh;padding-top:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
