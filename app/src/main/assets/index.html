<title>Casa 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Interface limpa: fundo escuro neutro, mosaicos grandes e redondos, âmbar só para o que está ligado. */
:root{
  --bg:#16171c; --panel:#1d1f26; --tile:#262932; --line:#2d303a;
  --fg:#f4f1ea; --mute:#8e919c;
  --amber:#f2b134; --amber-ink:#2b1c00;
  --font-display:'Manrope','Segoe UI',system-ui,sans-serif;
  --font-body:'Manrope','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;display:flex;flex-direction:column;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
#top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px max(18px,env(safe-area-inset-right,0px)) 6px max(18px,env(safe-area-inset-left,0px))}
#top h1{margin:0;font:700 20px/1.1 var(--font-display);letter-spacing:-.01em}
#sum{margin:4px 0 0;color:var(--mute);font-size:12.5px}
#sum b{color:var(--amber);font-weight:700}
#gear{flex:none;width:40px;height:40px;border:0;background:var(--tile);border-radius:50%;display:grid;place-items:center;padding:0;color:var(--mute)}
#gear svg{width:19px;height:19px}
#gear.ok{color:var(--amber)}
#gear[hidden]{display:none}
.hr{display:flex;gap:8px;flex:none}
#cfg{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(0,0,0,.62);display:flex;align-items:flex-end;z-index:50}
#cfg[hidden]{display:none}
.cfgbox{width:100%;max-height:90vh;overflow-y:auto;background:var(--panel);border-radius:28px 28px 0 0;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));box-sizing:border-box}
.cfgbox h2{margin:0 0 4px;font:700 18px var(--font-display)}
.cfgp{margin:0 0 14px;color:var(--mute);font-size:12.5px}
.cfgbox label{display:block;margin:0 0 10px;font-size:12px;color:var(--mute);font-weight:600}
.cfgbox input,.cfgbox select{display:block;width:100%;box-sizing:border-box;margin-top:5px;background:var(--tile);border:0;border-radius:12px;padding:11px 12px;color:var(--fg);font:inherit;font-size:14px}
.cfbtn{width:100%;border:0;border-radius:14px;padding:13px;font-weight:700;background:var(--amber);color:var(--amber-ink);margin-top:4px}
.cfbtn.ghost{background:var(--tile);color:var(--fg);margin-top:14px}
#cf_msg{min-height:18px;margin:10px 0 6px;font-size:12.5px;color:var(--mute)}
#cf_map h3{margin:14px 0 8px;font:700 13px var(--font-body)}
#dn{flex:none;width:40px;height:40px;border:0;background:var(--tile);border-radius:50%;display:grid;place-items:center;padding:0}
#dn svg{width:19px;height:19px}
.badge{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;border:2px solid #8d8a82;background:rgba(18,18,22,.62);color:#b9b5ab;display:grid;place-items:center;padding:0;pointer-events:auto;backdrop-filter:blur(2px)}
.badge svg{width:17px;height:17px}
.badge.on{border-color:var(--amber);color:var(--amber);background:rgba(60,42,8,.7);box-shadow:0 0 14px rgba(242,177,52,.55)}
.badge:focus-visible{outline:2px solid #fff;outline-offset:2px}
#stage{flex:1;min-height:0;position:relative;overflow:hidden;touch-action:none}
#stage canvas{display:block;width:100%;height:100%}
#labels{position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-50%);font:600 9.5px var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:#e4dfd4;text-shadow:0 1px 6px #000,0 0 2px #000;white-space:nowrap;opacity:.55}
.lbl.sel{color:#fff;opacity:1;font-weight:700}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;color:#c8c4bb;text-shadow:0 1px 4px #000;pointer-events:none;transition:opacity .6s}
#hint.off{opacity:0}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-8px);background:rgba(18,18,22,.94);border:1px solid var(--line);padding:7px 12px;border-radius:99px;font-size:12.5px;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translate(-50%,0)}
#sheet{flex:none;height:min(46vh,440px);background:var(--panel);border-radius:28px 28px 0 0;display:flex;flex-direction:column;min-height:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:14px max(18px,env(safe-area-inset-right,0px)) 2px max(18px,env(safe-area-inset-left,0px))}
.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px max(18px,env(safe-area-inset-right,0px)) 2px max(18px,env(safe-area-inset-left,0px))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:transparent;border-radius:99px;padding:7px 13px;font-weight:600;font-size:13px;color:var(--mute)}
.chip.on{background:var(--fg);color:#16171c}
.chip small{display:none}
.scene{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:var(--tile);border-radius:18px;padding:12px 4px 10px;font-weight:600;font-size:11.5px;color:var(--fg)}
.scene:active{background:#343845}
.scene svg{width:20px;height:20px;color:var(--amber)}
#list{flex:1;min-height:0;overflow-y:auto;padding:10px max(18px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;align-content:start}
.row{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:96px;background:var(--tile);border-radius:20px;padding:14px;cursor:pointer;user-select:none;transition:background .2s}
.row.on{background:var(--amber);color:var(--amber-ink)}
.ico{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);color:var(--mute)}
.row.on .ico{background:rgba(43,28,0,.13);color:var(--amber-ink)}
.ico svg{width:18px;height:18px}
.meta{min-width:0}
.meta b{display:block;font-weight:700;font-size:13.5px;line-height:1.25}
.meta small{display:block;margin-top:2px;color:var(--mute);font-size:11.5px}
.row.on .meta small{color:rgba(43,28,0,.7)}
.row:focus-visible,.chip:focus-visible,.scene:focus-visible,.step:focus-visible,#dn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.temp{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:4px}
.step{width:26px;height:26px;border-radius:50%;border:0;background:rgba(43,28,0,.14);font-weight:700;font-size:15px;line-height:1;color:inherit;padding:0}
.row:not(.on) .step{background:rgba(255,255,255,.08)}
.temp span{min-width:30px;text-align:center;font-weight:700;font-size:12.5px}
#note{grid-column:1/-1;color:var(--mute);font-size:11.5px;text-align:center;margin:4px 0 0}
@media (prefers-reduced-motion:reduce){.row,#toast,#hint{transition:none}}
</style>

<header id="top">
  <div>
    <h1>A minha casa</h1>
    <p id="sum"></p>
  </div>
  <div class="hr"><button id="gear" type="button" aria-label="Ligar à Tuya" hidden></button><button id="dn" type="button" aria-pressed="true" aria-label="Alternar dia e noite"></button></div>
</header>
<main id="stage">
  <canvas id="c" aria-label="Casa em 3D. Arrasta para rodar, toca nas luzes para ligar ou desligar."></canvas>
  <div id="labels"></div>
  <div id="toast" role="status"></div>
  <div id="hint">Arrasta para rodar · pinça para aproximar · toca nas luzes</div>
</main>
<section id="sheet">
  <div class="chips" id="chips" role="tablist" aria-label="Divisões"></div>
  <div class="scenes" id="scenes" aria-label="Cenas"></div>
  <div id="list"></div>
</section>

<div id="cfg" hidden role="dialog" aria-label="Ligar à Tuya"><div class="cfgbox">
  <h2>Ligar à Tuya</h2>
  <p class="cfgp">Os dados ficam guardados só neste aparelho.</p>
  <label>Access ID<input id="cf_id" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label>Access Secret<input id="cf_sec" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <label>UID da conta (Devices → Link App Account)<input id="cf_uid" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
  <button id="cf_go" class="cfbtn" type="button">Ligar e carregar dispositivos</button>
  <label style="margin-top:14px">Qualidade do 3D<select id="cf_q"><option value="high">Alta</option><option value="low">Leve (tablets antigos)</option></select></label>
  <p id="cf_msg" role="status"></p>
  <div id="cf_map"></div>
  <button id="cf_close" class="cfbtn ghost" type="button">Fechar</button>
</div></div>
<script src="three.min.js"></script>

function dist(){ var k=Object.keys(ptrs); if(k.length<2) return 0; var a=ptrs[k[0]],b=ptrs[k[1]]; return Math.hypot(a.x-b.x,a.y-b.y); }
function up(e){ var p=ptrs[e.pointerId]; if(!p) return; var tap=Object.keys(ptrs).length===1 && Math.hypot(e.clientX-p.sx,e.clientY-p.sy)<8 && moved<10; delete ptrs[e.pointerId]; pinch0=0; if(tap&&e.type==='pointerup') tapAt(e.clientX,e.clientY); }
canvas.addEventListener('pointerup',up); canvas.addEventListener('pointercancel',up);
canvas.addEventListener('wheel',function(e){ e.preventDefault(); tR=Math.max(5,Math.min(40,tR*(1+e.deltaY*0.001))); },{passive:false});

var ray=new THREE.Raycaster(), v2=new THREE.Vector2();
function tapAt(cx,cy){
  var b=canvas.getBoundingClientRect(); v2.set(((cx-b.left)/b.width)*2-1,-((cy-b.top)/b.height)*2+1); ray.setFromCamera(v2,camera);
  var h=ray.intersectObjects(hits,false);
  if(h.length){ toggle(h[0].object.userData.dev,true); return; }
  var f=ray.intersectObjects(floors,false);
  if(f.length){ var k=f[0].object.userData.room; setSel(sel===k?'all':k); }
}

/* ------------------------------------------------------------ lógica/UI */
function dev(id){ for(var i=0;i<DEV.length;i++) if(DEV[i].id===id) return DEV[i]; }
var toastEl=document.getElementById('toast'), tt;
function toast(t){ toastEl.textContent=t; toastEl.classList.add('on'); clearTimeout(tt); tt=setTimeout(function(){ toastEl.classList.remove('on'); },1600); }
function toggle(id,say){ var s=st[id], d=dev(id); s.on=!s.on; save(); refresh(); sendSwitch(id,s.on); if(say) toast(d.name+' · '+R[d.room].n+' '+(d.kind==='cam'?(s.on?'a gravar':'em pausa'):(s.on?'ligado':'desligado'))); }
var phT=null;
function setSel(k){ sel=k; phT=(k==='all'?0.9:0.5); focus(); refresh(); }

var ICO={
  bulb:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>',

  led:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M6 8v8M12 8v8M18 8v8"/></svg>',

  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg>',
  film:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></svg>',
  moon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg>',
  door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h9"/></svg>'
};
ICO.plug='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v5M15 3v5M6 8h12v3a6 6 0 0 1-12 0zM12 17v4"/></svg>';
function kindIco(d){ return d.kind==='plug'?ICO.plug:d.kind==='ceil'?ICO.bulb:d.kind==='lamp'?ICO.lamp:d.kind==='led'?ICO.led:d.kind==='heater'?ICO.heater:ICO.cam; }

var chipsEl=document.getElementById('chips'), scenesEl=document.getElementById('scenes'), listEl=document.getElementById('list'), sumEl=document.getElementById('sum');
var ORDER=['sala','cozinha','marquise','quarto','wcsuite','minicorr','visitas','escritorio','corredor','corredor2','entrada','wcserv','despensa'];
function mkChips(){
  var rooms=['all'].concat(ORDER.filter(function(k){ return DEV.some(function(d){return d.room===k;}); }));
  chipsEl.innerHTML=''; rooms.forEach(function(k){
    var n=k==='all'?DEV.length:DEV.filter(function(d){return d.room===k;}).length, b=document.createElement('button');
    b.className='chip'+(sel===k?' on':''); b.setAttribute('role','tab'); b.setAttribute('aria-selected',sel===k);
    b.innerHTML=(k==='all'?'Casa toda':R[k].n)+'<small>'+n+'</small>'; b.onclick=function(){ setSel(k); }; chipsEl.appendChild(b);
  });
}
function mkScenes(){
  scenesEl.innerHTML=''; SCENES.forEach(function(sc){
    var b=document.createElement('button'); b.className='scene'; b.innerHTML=ICO[sc.ico]+'<span>'+sc.n+'</span>';
    b.onclick=function(){ var pv={}; DEV.forEach(function(d){ pv[d.id]=st[d.id].on; }); sc.f(st); save(); refresh(); toast('Cena: '+sc.n); DEV.forEach(function(d){ if(pv[d.id]!==st[d.id].on) sendSwitch(d.id,st[d.id].on); }); }; scenesEl.appendChild(b);
  });
}
function mkList(){
  var items=DEV.filter(function(d){ return catOk(d)&&(sel==='all'||d.room===sel||d.room2===sel); });
  listEl.innerHTML='';
  items.forEach(function(d){
    var s=st[d.id], row=document.createElement('div'); row.className='row'+(s.on?' on':'');
    row.tabIndex=0; row.setAttribute('role','switch'); row.setAttribute('aria-checked',s.on); row.setAttribute('aria-label',d.name+', '+R[d.room].n);
    var state=d.kind==='cam'?(s.on?'a gravar':'em pausa'):d.kind==='heater'?(s.on?'ligado':'desligado'):d.kind==='plug'?(s.on?'ligada':'desligada'):(s.on?'acesa':'apagada');
    row.innerHTML='<span class="ico">'+kindIco(d)+'</span><div class="meta"><b>'+d.name+'</b><small>'+(sel==='all'?R[d.room].n+' · ':'')+state+'</small></div>';
    if(d.kind==='heater'){
      var t=document.createElement('div'); t.className='temp'; t.innerHTML='<button class="step" aria-label="Baixar temperatura">−</button><span>'+s.temp+'°</span><button class="step" aria-label="Subir temperatura">+</button>';
      var bs=t.querySelectorAll('button');
      bs[0].onclick=function(e){ e.stopPropagation(); s.temp=Math.max(10,s.temp-1); save(); refresh(); };
      bs[1].onclick=function(e){ e.stopPropagation(); s.temp=Math.min(30,s.temp+1); save(); refresh(); };
      row.appendChild(t);
    }
    row.onclick=function(){ toggle(d.id,false); };
    row.onkeydown=function(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggle(d.id,false); } };
    listEl.appendChild(row);
  });
  var n=document.createElement('p'); n.id='note'; n.textContent=linked?('Ligado à Tuya · '+Object.keys(MAP).length+' aparelhos associados'):(NA?'Toca na engrenagem para ligar à Tuya.':'Demonstração: os botões não controlam aparelhos reais. Instala a app Android para ligar à Tuya.'); listEl.appendChild(n);
}
function refresh(){
  var ls=DEV.filter(function(d){return LIGHT_KINDS[d.kind];}), on=ls.filter(function(d){return st[d.id].on;}).length;
  sumEl.innerHTML='<b>'+on+'</b> de '+ls.length+' luzes acesas · aquecedor '+(st.sa_heat.on?'a '+st.sa_heat.temp+'°':'desligado');
  mkChips(); mkList();
  Object.keys(lbl).forEach(function(k){ lbl[k].classList.toggle('sel',k===sel); });
  badges.forEach(function(b){ b.el.classList.toggle('on',!!st[b.d.id].on); b.el.hidden=!catOk(b.d); });
}
var night=true, nv=1, NB=new THREE.Color(0x5a5b64), DB=new THREE.Color(0xc9ccd6), NG=new THREE.Color(0x4a4b53), DG=new THREE.Color(0xaeb1bb), NS=new THREE.Color(0xd6dcff), DS=new THREE.Color(0xfff1d8);
var dn=document.getElementById('dn');
ICO.sun='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
function dnIco(){ dn.innerHTML=night?ICO.moon:ICO.sun; dn.style.color=night?'#f4f1ea':'#f2b134'; }
dn.onclick=function(){ night=!night; dn.setAttribute('aria-pressed',night); dnIco(); }; dnIco();
canvas.addEventListener('pointerdown',function(){ phT=null; document.getElementById('hint').classList.add('off'); });
var cat='all';
function catOk(d){ return cat==='all'||(cat==='luzes'&&LIGHT_KINDS[d.kind])||(cat==='clima'&&d.kind==='heater')||(cat==='cam'&&d.kind==='cam'); }
// botões sobre os objetos, só nos quartos, na cozinha e na sala
var BADGE_ROOMS={quarto:1,visitas:1,cozinha:1,marquise:1,sala:1}, badges=[];
DEV.forEach(function(d){ if(!BADGE_ROOMS[d.room]) return; var b=document.createElement('button'); b.type='button'; b.className='badge'; b.setAttribute('aria-label',d.name+', '+R[d.room].n); b.innerHTML=kindIco(d); b.onclick=function(){ toggle(d.id,true); }; labelsEl.appendChild(b); badges.push({d:d,el:b}); });
/* ------------------------------------------------------------ Tuya (só na app Android) */
var NA=window.TuyaNative||null, MAPKEY='casa3d-map-v1', MAP={}, TD=[], cbs={}, cbn=0, linked=false, lastCmd={};
try{ MAP=JSON.parse(localStorage.getItem(MAPKEY)||'{}')||{}; }catch(e){}
function saveMap(){ try{ localStorage.setItem(MAPKEY,JSON.stringify(MAP)); }catch(e){} }
window.__tuyaCb=function(id,txt){ var f=cbs[id]; delete cbs[id]; if(!f) return; var r; try{ r=JSON.parse(txt); }catch(e){ r={success:false,msg:'resposta inválida'}; } f(r); };
function tcall(method,path,body){ return new Promise(function(res){ var id='c'+(++cbn); cbs[id]=res; NA.request(id,method,path,body?JSON.stringify(body):''); }); }
function tcfg(){ try{ return JSON.parse(NA.getConfig()); }catch(e){ return {}; } }
function tdev(id){ for(var i=0;i<TD.length;i++) if(TD[i].id===id) return TD[i]; return null; }
function swCode(td){
  var s=(td&&td.status)||[], pri=['switch_led','switch_1','switch'], i, j;
  for(i=0;i<pri.length;i++) for(j=0;j<s.length;j++) if(s[j].code===pri[i]&&typeof s[j].value==='boolean') return pri[i];
  for(j=0;j<s.length;j++) if(/^switch/.test(s[j].code)&&typeof s[j].value==='boolean') return s[j].code;
  return null;
}
function loadDevices(){
  var c=tcfg(); if(!c.id||!c.hasSecret||!c.uid) return Promise.reject(new Error('faltam dados'));
  return tcall('GET','/v1.0/users/'+c.uid+'/devices').then(function(r){ if(!r.success) throw new Error(r.msg||'a Tuya recusou'); TD=r.result||[]; linked=true; setGear(); return TD; });
}
function syncFromTuya(){
  if(!linked) return; var changed=false, now=Date.now();
  DEV.forEach(function(d){ var m=MAP[d.id]; if(!m||(lastCmd[d.id]&&now-lastCmd[d.id]<5000)) return; var td=tdev(m), c=swCode(td); if(!c) return;
    var v=td.status.filter(function(x){return x.code===c;})[0].value; if(st[d.id].on!==v){ st[d.id].on=v; changed=true; } });
  if(changed){ save(); refresh(); }
}
function sendSwitch(id,on){
  var m=MAP[id]; if(!NA||!m) return; var td=tdev(m), c=swCode(td);
  if(!c){ toast('Este aparelho não tem interruptor'); return; }
  lastCmd[id]=Date.now();
  tcall('POST','/v1.0/devices/'+m+'/commands',{commands:[{code:c,value:!!on}]}).then(function(r){
    if(!r.success){ st[id].on=!on; save(); refresh(); toast('Erro Tuya: '+(r.msg||'falhou')); }
    else{ td.status.forEach(function(x){ if(x.code===c) x.value=!!on; }); }
  });
}
function poll(){ if(!NA) return; loadDevices().then(syncFromTuya).catch(function(){}); }
var cfgEl=document.getElementById('cfg'), gear=document.getElementById('gear'), cfMsg=document.getElementById('cf_msg');
function setGear(){ gear.classList.toggle('ok',linked); }
function drawMap(){
  var box=document.getElementById('cf_map'); box.innerHTML='';
  if(!TD.length) return;
  var hd=document.createElement('h3'); hd.textContent='Associa cada aparelho da casa a um da Tuya'; box.appendChild(hd);
  var sorted=TD.slice().sort(function(a,b){ return (a.name||'').localeCompare(b.name||''); });
  DEV.forEach(function(d){
    var lb=document.createElement('label'); lb.appendChild(document.createTextNode(R[d.room].n+' · '+d.name));
    var sel=document.createElement('select'); var o0=document.createElement('option'); o0.value=''; o0.textContent='— não ligado —'; sel.appendChild(o0);
    sorted.forEach(function(t){ var o=document.createElement('option'); o.value=t.id; o.textContent=(t.name||t.id)+(t.online===false?' (offline)':''); if(MAP[d.id]===t.id) o.selected=true; sel.appendChild(o); });
    sel.onchange=function(){ if(sel.value) MAP[d.id]=sel.value; else delete MAP[d.id]; saveMap(); syncFromTuya(); refresh(); };
    lb.appendChild(sel); box.appendChild(lb);
  });
}
function connect(saveFirst){
  if(saveFirst) NA.saveConfig(document.getElementById('cf_id').value.trim(),document.getElementById('cf_sec').value.trim(),document.getElementById('cf_uid').value.trim());
  cfMsg.textContent='A ligar…';
  loadDevices().then(function(){ cfMsg.textContent='Ligado · '+TD.length+' dispositivos encontrados'; document.getElementById('cf_sec').value=''; drawMap(); syncFromTuya(); refresh(); })
    .catch(function(e){ cfMsg.textContent='Erro: '+e.message; });
}
if(NA){
  gear.hidden=false; gear.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L4 14h7l-1 7 9-11h-7z"/></svg>';
  gear.onclick=function(){ var c=tcfg(); document.getElementById('cf_id').value=c.id||''; document.getElementById('cf_uid').value=c.uid||''; var s=document.getElementById('cf_sec'); s.value=''; s.placeholder=c.hasSecret?'(guardado)':'cola aqui'; cfgEl.hidden=false; if(c.id&&c.hasSecret&&c.uid&&!TD.length) connect(false); else drawMap(); };
  document.getElementById('cf_go').onclick=function(){ connect(true); };
  var cq=document.getElementById('cf_q'); cq.value=LOW?'low':'high'; cq.onchange=function(){ try{ localStorage.setItem(QK,cq.value); }catch(e){} location.reload(); };
  document.getElementById('cf_close').onclick=function(){ cfgEl.hidden=true; };
  var c0=tcfg(); if(c0.id&&c0.hasSecret&&c0.uid){ poll(); }
  setInterval(poll,15000);
  document.addEventListener('visibilitychange',function(){ if(!document.hidden) poll(); });
}
mkScenes(); refresh();

/* ------------------------------------------------------------ ciclo */
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var tmp=new THREE.Vector3();
function frame(t){
  requestAnimationFrame(frame);
  nv+=((night?1:0)-nv)*0.06; hemi.intensity=0.95-0.2*nv; dl.intensity=0.9-0.3*nv; dl.color.copy(DS).lerp(NS,nv);
  scene.background.copy(DB).lerp(NB,nv); ground.material.color.copy(DG).lerp(NG,nv);
  if(phT!=null){ ph+=(phT-ph)*0.12; if(Math.abs(phT-ph)<0.002) phT=null; }
  tgt.lerp(tT,0.1); rad+=(tR-rad)*0.1;
  camera.position.set(tgt.x+rad*Math.sin(ph)*Math.sin(th),tgt.y+rad*Math.cos(ph),tgt.z+rad*Math.sin(ph)*Math.cos(th)); camera.lookAt(tgt);
  var litSum={}, litN={};
  DEV.forEach(function(d){
    var s=st[d.id], v=d.v+=((s.on?1:0)-d.v)*0.12, c=OFFC.clone().lerp(d.col3,v);
    if(d.kind==='heater'){ d.mark.material.emissiveIntensity=v*(0.9+(reduce?0:0.25*Math.sin(t*0.004))); d.pool.material.opacity=v*(0.25+0.3*nv); }
    else if(d.kind==='cam'){ var blink=s.on?(reduce?1:(0.5+0.5*Math.sin(t*0.006))):0; d.dot.material.color.set(0x77726a).lerp(new THREE.Color(0xff3b4e),blink); }
    else{ d.mark.material.color.copy(c); if(d.pool) d.pool.material.opacity=v*(0.3+0.6*nv)*(d.kind==='led'?1.1:1); if(d.kind==='ceil'){ var k=0.9+0.35*v; d.mark.scale.set(k,k,k); (d.extra||[]).forEach(function(x){ x.mark.material.color.copy(c); x.mark.scale.set(k,k,k); x.pool.material.opacity=d.pool.material.opacity; }); } }
    if(d.screens) d.screens.forEach(function(m){ m.emissiveIntensity=v*0.95; });
    if(LIGHT_KINDS[d.kind]){ [d.room].concat(d.room2||[]).forEach(function(rk){ litSum[rk]=(litSum[rk]||0)+v; litN[rk]=(litN[rk]||0)+1; }); }
  });
  Object.keys(floorMats).forEach(function(rk){ var bk=rk.split('#')[0], f=litN[bk]?Math.min(1,litSum[bk]/litN[bk]*1.4):0; floorMats[rk].emissiveIntensity=f*(0.06+0.22*nv); });
  Object.keys(lbl).forEach(function(rk){ var r=R[rk]; tmp.set(r.x+r.w/2,0.2,r.z+r.d/2).project(camera); lbl[rk].style.left=((tmp.x*0.5+0.5)*stage.clientWidth)+'px'; lbl[rk].style.top=((-tmp.y*0.5+0.5)*stage.clientHeight)+'px'; });
  badges.forEach(function(b){ if(b.el.hidden) return; var d=b.d, ox=d.kind==='lamp'?0.25:0; tmp.set(d.x+ox,d.kind==='cam'?1.6:(d.kind==='led'?0.9:(d.kind==='plug'?0.75:1.5)),d.z+ox).project(camera); b.el.style.left=((tmp.x*0.5+0.5)*stage.clientWidth)+'px'; b.el.style.top=((-tmp.y*0.5+0.5)*stage.clientHeight)+'px'; });
  renderer.render(scene,camera);
}
resize(); rad=tR; frame(0);
setTimeout(resize,60);
})();
</script>
